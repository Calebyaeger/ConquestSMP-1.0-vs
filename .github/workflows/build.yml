name: Build AntiCheat

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted

      - name: Build plugin
        run: |
          cd extracted/ConquestSMP-AntiCheat
          mvn --batch-mode clean package

      - uses: actions/upload-artifact@v4
        with:
          name: ConquestSMP-AntiCheat
          path: extracted/**/target/*.jar
